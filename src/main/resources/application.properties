################# DATABASE #########################
# Default: a local SQLite file (microfinance.db) seeded with fake demo data, so the
# API runs with no database server. For MySQL, set the DB_* variables (see .env.example).
# Credentials come from the environment, never from this file.
spring.datasource.url=${DB_URL:jdbc:sqlite:microfinance.db?journal_mode=WAL&busy_timeout=5000}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.sqlite.hibernate.dialect.SQLiteDialect}
# Hibernate's ID generator needs its own connection, so keep at least 2. SQLite
# serializes writes (WAL + busy_timeout make the others wait instead of failing).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Demo schema and seed data (schema-sqlite.sql, data-sqlite.sql) run after Hibernate
# creates the entity tables. Both are idempotent. Set DB_SEED=never for a real database.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_SEED:always}
spring.sql.init.platform=${DB_PLATFORM:sqlite}

################# SERVER ###########################
server.port=${PORT:8080}
spring.main.allow-bean-definition-overriding=true

# Comma-separated list of front-end origins allowed to call /fin/** from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

################# LOGGING ##########################
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
